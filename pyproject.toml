[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-tax-check"
dynamic = ["version"]
description = "Open-source AI-assisted tax health check for Chinese enterprises"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{name = "MasterBenC"}]
keywords = ["tax", "china", "audit", "risk", "agent-skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
excel = [
  "openpyxl>=3.1.5,<4",
  "xlrd>=2.0.2,<3",
  "defusedxml>=0.7.1,<1",
]
ocr = [
  "pypdf>=6.14.2,<7",
  "pypdfium2>=5.12.1,<6",
  "Pillow>=12.3,<13",
  "paddleocr>=3.7,<4",
  "paddlepaddle>=3.3.1,<4",
]

[project.scripts]
opentaxcheck = "open_tax_check.cli:main"

[project.urls]
Repository = "https://github.com/MasterBenC/open-tax-check"
Issues = "https://github.com/MasterBenC/open-tax-check/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"open_tax_check.tax_packs" = ["*.json"]

[tool.setuptools.dynamic]
version = {attr = "open_tax_check.__version__"}
