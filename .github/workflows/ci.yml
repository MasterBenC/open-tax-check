name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build pytest
      - run: python -m pip install -e ".[excel]"
      - run: python -m pytest -q
      - run: python scripts/run_fictional_example.py --output work/ci-demo
      - run: python -m build
      - run: python scripts/validate_release.py --require-distributions

  ocr-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e ".[ocr]"
      - run: python -m pytest tests/test_ocr_smoke.py::test_real_ocr_runtime_smoke -q
        env:
          OPEN_TAX_CHECK_RUN_OCR_SMOKE: "1"
          PADDLE_PDX_MODEL_SOURCE: "BOS"
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
